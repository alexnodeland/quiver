name: Publish npm packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      # 1. Compile Rust -> wasm-bindgen glue into packages/@quiver/wasm/ (quiver.js,
      #    quiver.d.ts, quiver_bg.wasm). The TypeScript build depends on this.
      - name: Build WASM glue
        run: make wasm

      # 2. Install the whole workspace from the committed root lockfile.
      - name: Install npm dependencies
        run: npm ci

      # 3. Build the TypeScript packages in dependency order:
      #    @quiver/wasm (tsup, needs the glue from step 1) -> @quiver/types ->
      #    @quiver/react (imports the built @quiver/wasm + @quiver/types types).
      - name: Build TypeScript packages
        run: npm run build:ts

      - name: Verify package versions
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"

          # Check each package version matches
          for pkg in packages/@quiver/wasm packages/@quiver/types packages/@quiver/react; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            echo "$pkg version: $PKG_VERSION"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "ERROR: Version mismatch in $pkg"
              exit 1
            fi
          done

      # Dry-run proof that each package tarball assembles (runs on every trigger).
      - name: Pack packages (dry run)
        run: |
          npm pack --dry-run --workspace @quiver/types
          npm pack --dry-run --workspace @quiver/wasm
          npm pack --dry-run --workspace @quiver/react

      # Publish in dependency order: @quiver/types and @quiver/wasm first, then
      # @quiver/react (which depends on both). --provenance is optional; it needs the
      # `id-token: write` permission set above and public npm.
      - name: Publish @quiver/types
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --workspace @quiver/types --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @quiver/wasm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --workspace @quiver/wasm --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @quiver/react
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --workspace @quiver/react --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "## npm Package Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "**Dry run** - packages were not published" >> $GITHUB_STEP_SUMMARY
          else
            echo "Successfully published:" >> $GITHUB_STEP_SUMMARY
            echo "- @quiver/wasm" >> $GITHUB_STEP_SUMMARY
            echo "- @quiver/types" >> $GITHUB_STEP_SUMMARY
            echo "- @quiver/react" >> $GITHUB_STEP_SUMMARY
          fi
